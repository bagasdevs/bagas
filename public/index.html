<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    
    <!-- Preconnect to external origins for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://i.ibb.co" crossorigin>
    
    <!-- DNS prefetch for additional performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://i.ibb.co">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"></noscript>
    
    <!-- Preload hero image for LCP optimization -->
    <link rel="preload" href="https://i.ibb.co/mFgw9F9K/profile.jpg" as="image" fetchpriority="high">
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="Bagas Cahya Pamungkas - Web Developer Portfolio. Experienced in back-end development, Vue.js, PHP, Laravel and modern web technologies. View my projects and get in touch for collaborations.">
    <meta name="keywords" content="web developer, portfolio, bagas cahya, back-end developer, vue.js, php, laravel, javascript, frontend developer, fullstack developer">
    <meta name="author" content="Bagas Cahya Pamungkas">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#111827">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Bagas Cahya - Web Developer Portfolio">
    <meta property="og:description" content="Experienced web developer specializing in back-end development with modern web technologies. View my projects and get in touch for collaborations.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bagas.site">
    <meta property="og:image" content="https://bagas.site/img/portfolio-v1.png">
    <meta property="og:site_name" content="Bagas Cahya Portfolio">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bagas Cahya - Web Developer Portfolio">
    <meta name="twitter:description" content="Experienced web developer specializing in back-end development with modern web technologies.">
    <meta name="twitter:image" content="https://bagas.site/img/portfolio-v1.png">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://bagas.site">
    
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Bagas Cahya Pamungkas",
      "jobTitle": "Web Developer",
      "description": "Experienced web developer specializing in back-end development with modern web technologies including PHP, Laravel, Vue.js, and JavaScript.",
      "url": "https://bagas.site",
      "image": "https://bagas.site/img/portfolio-v1.png",
      "sameAs": [
        "https://github.com/bagascahya",
        "https://linkedin.com/in/bagascahya"
      ],
      "knowsAbout": [
        "Web Development",
        "Back-end Development",
        "PHP",
        "Laravel",
        "Vue.js",
        "JavaScript",
        "Frontend Development"
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "Freelance Web Developer"
      }
    }
    </script>
    
    <title>Bagas Cahya - Web Developer Portfolio | PHP, Laravel, Vue.js</title>
    
    <!-- Critical CSS inline for faster rendering and reduced CLS -->
    <style>
      /* Critical above-the-fold styles with performance optimizations */
      html {
        line-height: 1.15;
        -webkit-text-size-adjust: 100%;
      }
      
      body {
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: hsl(0, 0%, 7%);
        color: #2c3e50;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-display: swap;
      }
      
      /* Optimize layout shifts */
      * {
        box-sizing: border-box;
      }
      
      /* Critical layout styles */
      .max-w-7xl {
        max-width: 80rem;
        width: 100%;
      }
      
      .mx-auto {
        margin-left: auto;
        margin-right: auto;
      }
      
      .text-white {
        color: #ffffff;
      }
      
      .text-amber-200 {
        color: #fde68a;
      }
      
      /* Prevent layout shift with consistent heights */
      .min-h-screen {
        min-height: 100vh;
        min-height: 100dvh; /* Dynamic viewport height for mobile */
      }
      
      /* Image optimization to prevent CLS */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      
      /* Container for images with aspect ratio */
      .aspect-square {
        aspect-ratio: 1 / 1;
      }
      
      .aspect-video {
        aspect-ratio: 16 / 9;
      }
      
      /* Navigation critical styles */
      nav {
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: blur(8px);
        background: rgba(17, 24, 39, 0.8);
      }
      
      /* Loading state optimization */
      .loading-placeholder {
        background: linear-gradient(90deg, #1f1f1f 25%, #2a2a2a 50%, #1f1f1f 75%);
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
        border-radius: 8px;
      }
      
      @keyframes loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      
      /* Critical animation styles for LCP optimization */
      .fade-enter-active, .fade-leave-active {
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .fade-enter-from, .fade-leave-to {
        opacity: 0;
      }
      
      /* Optimize hero section for LCP */
      .hero-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      
      /* Critical button styles */
      .btn-primary {
        background: linear-gradient(45deg, #f59e0b, #d97706);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 500;
        text-decoration: none;
        display: inline-block;
        transition: transform 0.2s ease;
      }
      
      .btn-primary:hover {
        transform: translateY(-2px);
      }
    </style>
    <!-- <link rel="stylesheet" href="../assets/css/style.css"> -->

  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
